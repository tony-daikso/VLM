# U-VLM CXR Stage 1（PadChest-GR）訓練設定
# 對應 STAGE1_PLAN.md 已拍板的決策：只做 lesion head（box->粗略mask）/ 512x512 / ResNet34+ImageNet 初始化

seed: 42

# 全量資料（4,555 筆，2026-09-16 解壓完成）。checkpoint/qa 輸出指到 /datadrive（不是本機
# /root/Desktop），因為這台 server 隨時可能被關機，本機磁碟不保證留得住 -- /datadrive 是持久化的
# 掛載點，訓練成果都要放在那裡（見使用者交代事項）
data:
  processed_dir: data/X-ray/PadChest-GR/processed

image:
  resolution: 512
  # PadChest-GR PNG 是 16-bit（見 STAGE1_PLAN.md 第 3/8 節），per-image 百分位 clip + min-max
  # stretch 到 [0,1] 再映射到 [-1,1]（跟 CT 版 window_normalize 輸出範圍一致，方便共用同款
  # ImageNet-adapted 1-channel encoder 的輸入假設）
  percentile_low: 0.5
  percentile_high: 99.5

augmentation:
  hflip_prob: 0.5
  rotation_deg: 10
  scale_jitter: 0.1
  intensity_jitter: 0.1

model:
  encoder_name: resnet34
  encoder_pretrained: true
  decoder_channels: [256, 128, 64, 32, 16]

train:
  batch_size: 64 # 全量資料在 L40S 上實測（batch16 只用了 8.3GB/46GB），往上調加快訓練
  epochs: 100
  early_stopping_patience: 20 # 全量資料規模正常，恢復標準 early stopping（小子集那次是使用者要求的特例）
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  num_workers: 4
  checkpoint_dir: /datadrive/VLM/U-VLM/X-ray/cxr/stage1/checkpoints
  log_every_n_steps: 10

loss:
  dice_weight: 1.0
  bce_weight: 1.0

eval:
  qa_overlay_dir: /datadrive/VLM/U-VLM/X-ray/cxr/stage1/qa
  num_qa_overlays: 20
